<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d18"/>
      <stop offset="100%" stop-color="#0f1824"/>
    </linearGradient>
    <linearGradient id="pri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="wav" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#00d4ff"/>
      <stop offset="80%"  stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background -->
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>

  <!-- Outer hexagon glow fill (very subtle) -->
  <!-- Pointy-top hex, center (100,94), radius 70 -->
  <!-- vertices: top(100,24) ur(161,59) lr(161,129) bot(100,164) ll(39,129) ul(39,59) -->
  <polygon points="100,24 161,59 161,129 100,164 39,129 39,59"
           fill="url(#pri)" fill-opacity="0.07"/>

  <!-- Outer hex outline with glow -->
  <polygon points="100,24 161,59 161,129 100,164 39,129 39,59"
           fill="none" stroke="url(#pri)" stroke-width="2.5" filter="url(#gl)"/>

  <!-- Inner hex ring for depth -->
  <!-- radius 50: top(100,44) ur(143,69) lr(143,119) bot(100,144) ll(57,119) ul(57,69) -->
  <polygon points="100,44 143,69 143,119 100,144 57,119 57,69"
           fill="none" stroke="url(#pri)" stroke-width="0.8" opacity="0.22"/>

  <!-- Circuit nodes at inner hex corners -->
  <circle cx="100" cy="44"  r="3"   fill="#00d4ff" opacity="0.45"/>
  <circle cx="143" cy="69"  r="2.5" fill="#7c3aed" opacity="0.45"/>
  <circle cx="143" cy="119" r="2.5" fill="#7c3aed" opacity="0.45"/>
  <circle cx="100" cy="144" r="3"   fill="#00d4ff" opacity="0.45"/>
  <circle cx="57"  cy="119" r="2.5" fill="#7c3aed" opacity="0.45"/>
  <circle cx="57"  cy="69"  r="2.5" fill="#7c3aed" opacity="0.45"/>

  <!-- M joint circuit pads: mask bg + glowing dot -->
  <circle cx="68"  cy="65" r="6"   fill="#080d18"/>
  <circle cx="68"  cy="65" r="5.5" fill="#00d4ff" opacity="0.85" filter="url(#sg)"/>
  <circle cx="100" cy="96" r="6"   fill="#080d18"/>
  <circle cx="100" cy="96" r="5.5" fill="#00d4ff" opacity="0.75" filter="url(#sg)"/>
  <circle cx="132" cy="65" r="6"   fill="#080d18"/>
  <circle cx="132" cy="65" r="5.5" fill="#00d4ff" opacity="0.85" filter="url(#sg)"/>

  <!-- M: white base stroke -->
  <path d="M68,120 L68,65 L100,96 L132,65 L132,120"
        fill="none" stroke="#dde3ec" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M: thin gradient overlay for depth -->
  <path d="M68,120 L68,65 L100,96 L132,65 L132,120"
        fill="none" stroke="url(#pri)" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- API waveform: ECG-style, fits inside outer hex bottom section -->
  <!-- baseline y=145, peaks y=135, troughs y=152 — all verified inside hex -->
  <path d="M70,145 L80,135 L90,152 L100,135 L110,152 L120,135 L130,145"
        fill="none" stroke="url(#wav)" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#sg)"/>

  <!-- Waveform peak / trough dots -->
  <circle cx="80"  cy="135" r="2.5" fill="#00d4ff" opacity="0.9"/>
  <circle cx="90"  cy="152" r="2"   fill="#00d4ff" opacity="0.55"/>
  <circle cx="100" cy="135" r="2.5" fill="#00d4ff" opacity="0.9"/>
  <circle cx="110" cy="152" r="2"   fill="#00d4ff" opacity="0.55"/>
  <circle cx="120" cy="135" r="2.5" fill="#00d4ff" opacity="0.9"/>
</svg>
